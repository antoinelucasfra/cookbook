003ci class=\"ph ph-scales\">\u003c/i> >971g\u003c/small> \u003cspan class=\"section-declaration-badge\" data-tooltip=\"Résultat intermédiaire pour cette section\">\u003ci class=\"ph ph-arrow-right\">\u003c/i> appareil\u003c/span>\u003c/h3>\n    \u003cdiv class=\"section-ingredients\">\n      \u003cul>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"farine\">farine \u003cspan class=\"quantity\">320 g\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 320g\">320g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"levure chimique\">levure chimique \u003cspan class=\"quantity\">2 tsp\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 8.9g\">~8.9g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"sucre\">sucre \u003cspan class=\"quantity\">2 tbsp\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 25.1g\">~25.1g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"sel\">sel \u003cspan class=\"quantity\">1/2 tsp\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 5.3g\">~5.3g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"babeurre\">babeurre \u003cspan class=\"quantity\">2 cup\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 492.1g\">~492.1g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"œuf\">œuf \u003cspan class=\"quantity\">2\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 120g\">~120g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"vanille\">vanille \u003cspan class=\"quantity\">1 tsp\u003c/span>\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli value=\"1\"> 0g\u003c/span>\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"ingredient\" data-name=\"levure chimique\">levure chimique \u003cspan class=\"quantity\">1/2 tsp\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 2.2g\">~2.2g\u003c/span>\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"ingredient\" data-name=\"sucre\">sucre \u003cspan class=\"quantity\">1/2 tbsp\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 6.3g\">~6.3g\u003c/span>\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"ingredient\" data-name=\"sel\">sel \u003cspan class=\"quantity\">1/8 tsp\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 1.4g\">~1.4g\u003c/span>\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"ingredient\" data-name=\"babeurre\">babeurre \u003cspan class=\"quantity\">1/2 cup\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 123g\">~123g\u003c/span>\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"ingredient\" data-name=\"œuf\">œuf \u003cspan class=\"quantity\">1/2\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 30g\">~30g\u003c/span>\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"ingredient\" data-name=\"vanille\">vanille \u003cspan class=\"quantity\">1/4 tsp\u003c/span>\u003c/span>\u003c/li>\n  \u003c/ul>\n\u003c/details>\n\n\u003cdetails class=\"cookware\">\n  \u003csummary>\u003ch2>Matériel\u003c/h2>\u003c/summary>\n  \u003cul>\n    \u003cli>\u003cspan class=\"cookware\" data-name=\"saladier\">saladier\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"cookware\" data-name=\"plaque à pâtisserie\">plaque à pâtisserie\u003c/span>\u003c/li>\n  \u003c/ul>\n\u003c/details>\n\n\u003cdiv class=\"instructions\">\n  \u003csection>\n    \u003ch3 class=\"section-header\">Pâte \u003csmall class=\"section-meta-badge section-meta-mass\" data-tooltip=\"Masse standardisée de la section (Manquant : vanille)\">\u003ci class=\"ph ph-scales\">\u003c/i> >243g\u003c/small> \u003cspan class=\"section-declaration-badge\" data-tooltip=\"Résultat intermédiaire pour cette section\">\u003ci class=\"ph ph-arrow-right\">\u003c/i> appareil\u003c/span>\u003c/h3>\n    \u003cdiv class=\"section-ingredients\">\n      \u003cul>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"farine\">farine \u003cspan class=\"quantity\">80 g\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 80g\">80g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"levure chimique\">levure chimique \u003cspan class=\"quantity\">1/2 tsp\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 2.2g\">~2.2g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"sucre\">sucre \u003cspan class=\"quantity\">1/2 tbsp\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 6.3g\">~6.3g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"sel\">sel \u003cspan class=\"quantity\">1/8 tsp\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 1.4g\">~1.4g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"babeurre\">babeurre \u003cspan class=\"quantity\">1/2 cup\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 123g\">~123g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"œuf\">œuf \u003cspan class=\"quantity\">1/2\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Masse standardisée: 30g\">~30g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"vanille\">vanille \u003cspan class=\"quantity\">1/4 tsp\u003c/span>\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli value=\"1\">\n        \u003cspan class=\"action\">Mélanger\u003c/span>         Dans un \u003cspan class=\"cookware\" data-name=\"saladier\">saladier\u003c/span>, fouetter la \u003cspan class=\"ingredient\" data-name=\"farine\" data-tooltip=\"80 g\n(Standardisé: 80g)\">farine\u003c/span>, la \u003cspan class=\"ingredient\" data-name=\"levure chimique\" data-tooltip=\"1/2 tsp\n(Standardisé: ~2.2g)\">levure chimique\u003c/span>, le \u003cspan class=\"ingredient\" data-name=\"sucre\" data-tooltip=\"1/2 tbsp\n(Standardisé: ~6.3g)\">sucre\u003c/span> et le \u003cspan class=\"ingredient\" data-name=\"sel\" data-tooltip=\"1/8 tsp\n(Standardisé: ~1.4g)\">sel\u003c/span>. \u003cspan class=\"declaration declaration-block\">\u003ci class=\"ph ph-arrow-elbow-down-right\">\u003c/i> mélange sec\u003c/span>\n      \u003c/li>\n      \u003cli value=\"2\">\n        \u003cspan class=\"action\">Incorporer\u003c/span>         Au \u003cspan class=\"reference\" data-tooltip=\"Ingrédient intermédiaire\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> mélange sec\u003c/span>, ajouter le \u003cspan class=\"ingredient\" data-name=\"babeurre\" data-tooltip=\"1/2 cup\n(Standardisé: ~123g)\">babeurre\u003c/span>, l&#039;\u003cspan class=\"ingredient\" data-name=\"œuf\" data-tooltip=\"1/2\n(Standardisé: ~30g)\">œuf\u003c/span> et l&#039;extrait de \u003cspan class=\"ingredient\" data-name=\"vanille\" data-tooltip=\"1/4 tsp\">vanille\u003c/span>.\n      \u003c/li>\n    \u003c/ol>\n  \u003c/section>\n  \u003csection>\n    \u003ch3 class=\"section-header\">Cuisson\u003c/h3>\n    \u003cdiv class=\"section-ingredients\">\n      \u003cul>\n        \u003cli>\u003cspan class=\"reference\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> appareil\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli value=\"1\">\n        \u003cspan class=\"action\">Cuire\u003c/span>         Verser la \u003cspan class=\"reference\" data-tooltip=\"Ingrédient intermédiaire\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> appareil\u003c/span> sur une \u003cspan class=\"cookware\" data-name=\"plaque à pâtisserie\">plaque à pâtisserie\u003c/span> à \u003cspan class=\"temp\" data-semantic=\"feu moyen\">\u003ci class=\"ph ph-thermometer\">\u003c/i> feu moyen\u003c/span> et cuire \u003cspan class=\"timer\" data-tooltip=\"Temps actif\" data-value=\"2\" data-unit=\"min\">\u003ci class=\"ph ph-timer\">\u003c/i> \u003cspan class=\"timer-text\">2 min\u003c/span>\u003c/span>.\n      \u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\u003c/div>\n\u003cdiv class=\"nutrition-panel\">\n  \u003cdiv class=\"nut-header\">Nutrition \u003cspan class=\"est-badge\" data-tooltip=\"Couverture: 43%\">Estimation\u003c/span>\u003c/div>\n  \u003cdiv class=\"nut-basis-single\">Par portion\u003c/div>\n  \u003cdiv class=\"nut-grid\" data-basis=\"perPortion\">\n    \u003cdiv class=\"nut-item\">\u003cspan class=\"label\">Calories\u003c/span> \u003cstrong>358 kcal\u003c/strong>\u003c/div>\n    \u003cdiv class=\"nut-item\">\u003cspan class=\"label\">Matières grasses\u003c/span> \u003cstrong>3.7 g\u003c/strong>\u003c/div>\n    \u003cdiv class=\"nut-item\">\u003cspan class=\"label\">Glucides\u003c/span> \u003cstrong>67.5 g\u003c/strong>\u003c/div>\n    \u003cdiv class=\"nut-item\">\u003cspan class=\"label\">Protéines\u003c/span> \u003cstrong>12 g\u003c/strong>\u003c/div>\n  \u003c/div>\n\u003c/div>\n",
