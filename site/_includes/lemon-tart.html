>\u003c/li>\n    \u003cli>\u003cspan class=\"ingredient\" data-name=\"Egg\">Egg \u003cspan class=\"quantity\">3.48\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 208.8g\">~208.8g\u003c/span>\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"ingredient\" data-name=\"Salt\">Salt \u003cspan class=\"quantity\">0.48 pinch\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 0.3g\">~0.3g\u003c/span>\u003c/span>\u003c/li>\n    \u003cli class=\"list-item-group\">\n      \u003cspan class=\"ingredient\" data-name=\"lemon\">lemon \u003cspan class=\"quantity\">4\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 123.6g\">~123.6g\u003c/span>\u003c/span> \u003cstrong>(Composite)\u003c/strong>:\n      \u003cul>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"lemon juice\">lemon juice \u003cspan class=\"quantity\">120 ml\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 123.6g\">~123.6g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"lemon zest\">lemon zest \u003cspan class=\"quantity\">2\u003c/span>\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/li>\n  \u003c/ul>\n\u003c/details>\n\n\u003cdetails class=\"cookware\">\n  \u003csummary>\u003ch2>Cookware\u003c/h2>\u003c/summary>\n  \u003cul>\n    \u003cli>\u003cspan class=\"cookware\" data-name=\"food processor\">food processor\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"cookware\" data-name=\"cling film\">cling film\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"cookware\" data-name=\"tart ring\">tart ring\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"cookware\" data-name=\"fork\">fork\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"cookware\" data-name=\"saucepan\">saucepan\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"cookware\" data-name=\"spatula\">spatula\u003c/span>\u003c/li>\n    \u003cli>\u003cspan class=\"cookware\" data-name=\"fine sieve\">fine sieve\u003c/span>\u003c/li>\n  \u003c/ul>\n\u003c/details>\n\n\u003cdiv class=\"instructions\">\n  \u003csection>\n    \u003ch3 class=\"section-header\">Dough \u003csmall class=\"section-meta-badge section-meta-retroplanning\">\u003ci class=\"ph ph-clock-counter-clockwise\">\u003c/i> -2h\u003c/small> \u003csmall class=\"section-meta-badge section-meta-mass\" data-tooltip=\"Section standardized mass (Estimated)\">\u003ci class=\"ph ph-scales\">\u003c/i> ~250g\u003c/small> \u003cspan class=\"section-declaration-badge has-module\" data-tooltip=\"Intermediate result for this section\">\u003cspan class=\"section-module-source\">\u003ci class=\"ph ph-package\">\u003c/i> Sweet Pastry Dough\u003c/span>\u003cspan class=\"section-decl-target\">\u003ci class=\"ph ph-arrow-right\">\u003c/i> pate\u003c/span>\u003c/span>\u003c/h3>\n    \u003cdiv class=\"section-ingredients\">\n      \u003cul>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"flour\">flour \u003cspan class=\"quantity\">121.2 g\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 121.2g\">121.2g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"butter\">butter \u003cspan class=\"quantity\">60.6 g\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 60.6g\">60.6g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"sugar\">sugar \u003cspan class=\"quantity\">38.8 g\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 38.8g\">38.8g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"egg\">egg \u003cspan class=\"quantity\">0.48\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 28.8g\">~28.8g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"salt\">salt \u003cspan class=\"quantity\">0.48 pinch\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 0.3g\">~0.3g\u003c/span>\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli value=\"1\">\n        \u003cspan class=\"action\">Mix\u003c/span>         In a \u003cspan class=\"cookware\" data-name=\"food processor\">food processor\u003c/span>, combine the \u003cspan class=\"ingredient\" data-name=\"flour\" data-tooltip=\"121.2 g\n(Standardized: 121.2g)\">flour\u003c/span>, the \u003cspan class=\"ingredient\" data-name=\"butter\" data-tooltip=\"60.6 g\n(Standardized: 60.6g)\">butter\u003c/span>, the \u003cspan class=\"ingredient\" data-name=\"sugar\" data-tooltip=\"38.8 g\n(Standardized: 38.8g)\">sugar\u003c/span>, the \u003cspan class=\"ingredient\" data-name=\"egg\" data-tooltip=\"0.48\n(Standardized: ~28.8g)\">egg\u003c/span> and the \u003cspan class=\"ingredient\" data-name=\"salt\" data-tooltip=\"0.48 pinch\n(Standardized: ~0.3g)\">salt\u003c/span>. \u003cspan class=\"declaration declaration-block\">\u003ci class=\"ph ph-arrow-elbow-down-right\">\u003c/i> pate$crumbs\u003c/span>\n      \u003c/li>\n      \u003cli value=\"2\">\n        \u003cspan class=\"action\">Fraiser\u003c/span>         Work the \u003cspan class=\"reference\" data-tooltip=\"Intermediate Ingredient\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> pate$crumbs\u003c/span> quickly to gather into a ball without overworking it.\n      \u003c/li>\n      \u003cli value=\"3\">\n        \u003cspan class=\"action\">Rest\u003c/span>         Wrap in \u003cspan class=\"cookware\" data-name=\"cling film\">cling film\u003c/span> and refrigerate for at least \u003cspan class=\"timer passive\" data-tooltip=\"Passive Time (Waiting, resting...)\" data-value=\"2\" data-unit=\"h\">\u003ci class=\"ph ph-hourglass\">\u003c/i> \u003cspan class=\"timer-text\">2 h\u003c/span>\u003c/span>.\n      \u003c/li>\n    \u003c/ol>\n  \u003c/section>\n  \u003csection>\n    \u003ch3 class=\"section-header\">Shell \u003csmall class=\"section-meta-badge section-meta-mass\" data-tooltip=\"Section standardized mass\">\u003ci class=\"ph ph-scales\">\u003c/i> 250g\u003c/small>\u003c/h3>\n    \u003cdiv class=\"section-ingredients\">\n      \u003cul>\n        \u003cli>\u003cspan class=\"reference\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> pate \u003cspan class=\"quantity\">250 \u003cspan class=\"unit\">g\u003c/span>\u003c/span>\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli value=\"1\">\n        \u003cspan class=\"action\">Line\u003c/span>         Roll out the \u003cspan class=\"reference\" data-tooltip=\"Intermediate Ingredient\nQuantity: 250 g\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> pate\u003c/span> and line a \u003cspan class=\"cookware\" data-name=\"tart ring\">tart ring\u003c/span>. Dock with a \u003cspan class=\"cookware\" data-name=\"fork\">fork\u003c/span>.\n      \u003c/li>\n      \u003cli value=\"2\">\n        \u003cspan class=\"action\">Blind bake\u003c/span>         Bake at \u003cspan class=\"temp\" data-value=\"170\" data-unit=\"°C\">\u003ci class=\"ph ph-thermometer\">\u003c/i> 170 °C\u003c/span> for \u003cspan class=\"timer passive\" data-tooltip=\"Passive Time (Waiting, resting...)\" data-value=\"15\" data-unit=\"min\">\u003ci class=\"ph ph-hourglass\">\u003c/i> \u003cspan class=\"timer-text\">15 min\u003c/span>\u003c/span> until lightly golden.\n      \u003c/li>\n    \u003c/ol>\n  \u003c/section>\n  \u003csection>\n    \u003ch3 class=\"section-header\">Curd \u003csmall class=\"section-meta-badge section-meta-mass\" data-tooltip=\"Section standardized mass (Missing: lemon-zest)\">\u003ci class=\"ph ph-scales\">\u003c/i> >514g\u003c/small> \u003cspan class=\"section-declaration-badge\" data-tooltip=\"Intermediate result for this section\">\u003ci class=\"ph ph-arrow-right\">\u003c/i> curd\u003c/span>\u003c/h3>\n    \u003cdiv class=\"section-ingredients\">\n > in a \u003cspan class=\"cookware\" data-name=\"saucepan\">saucepan\u003c/span>. \u003cspan class=\"declaration declaration-block\">\u003ci class=\"ph ph-arrow-elbow-down-right\">\u003c/i> curd mix\u003c/span>\n      \u003c/li>\n      \u003cli value=\"2\">\n        \u003cspan class=\"action\">Thicken\u003c/span>         Cook the \u003cspan class=\"reference\" data-tooltip=\"Intermediate Ingredient\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> curd\u003c/span> mix over \u003cspan class=\"temp\" data-semantic=\"low heat\">\u003ci class=\"ph ph-thermometer\">\u003c/i> low heat\u003c/span> for \u003cspan class=\"timer\" data-tooltip=\"Active Time\" data-value=\"5\" data-unit=\"min\">\u003ci class=\"ph ph-timer\">\u003c/i> \u003cspan class=\"timer-text\">5 min\u003c/span>\u003c/span>, stirring, until it coats the \u003cspan class=\"cookware\" data-name=\"spatula\">spatula\u003c/span>. Add the \u003cspan class=\"ingredient\" data-name=\"butter\" data-tooltip=\"60 g\n(Standardized: 60g)\">butter\u003c/span> off heat.\n      \u003c/li>\n      \u003cli value=\"3\">\n        \u003cspan class=\"action\">Strain\u003c/span>         Pass through a \u003cspan class=\"cookware\" data-name=\"fine sieve\">fine sieve\u003c/span>.\n      \u003c/li>\n    \u003c/ol>\n  \u003c/section>\n  \u003csection>\n    \u003ch3 class=\"section-header\">Assembly\u003c/h3>\n    \u003cdiv class=\"section-ingredients\">\n      \u003cul>\n        \u003cli>\u003cspan class=\"reference\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> curd\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli value=\"1\">\n        \u003cspan class=\"action\">Fill\u003c/span>         Pour the \u003cspan class=\"reference\" data-tooltip=\"Intermediate Ingredient\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> curd\u003c/span> into the shell. Set for \u003cspan class=\"timer passive\" data-tooltip=\"Passive Time (Waiting, resting...)\" data-value=\"3\" da i>\u003cspan class=\"ingredient\" data-name=\"flour\">flour \u003cspan class=\"quantity\">242.4 g\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 242.4g\">242.4g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"butter\">butter \u003cspan class=\"quantity\">121.2 g\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 121.2g\">121.2g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"sugar\">sugar \u003cspan class=\"quantity\">77.6 g\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 77.6g\">77.6g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"egg\">egg \u003cspan class=\"quantity\">0.96\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 57.6g\">~57.6g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"salt\">salt \u003cspan class=\"quantity\">0.96 pinch\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 0.7g\">~0.7g\u003c/span>\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli value=\"1\">\n        \u003cspan class=\"action\">Mix\u003c/span>         In a \u003cspan class=\"cookware\" data-name=\"food processor\">food processor\u003c/span>, combine the \u003cspan class=\"ingredient\" data-name=\"flour\" data-tooltip=\"242.4 g\n(Standardized: 242.4g)\">flour\u003c/span>, the \u003cspan class=\"ingredient\" data-name=\"butter\" data-tooltip=\"121.2 g\n(Standardized: 121.2g)\">butter\u003c/span>, the \u003cspan class=\"ingredient\" data-name=\"sugar\" data-tooltip=\"77.6 g\n(Standardized: 77.6g)\">sugar\u003c/span>, the \u003cspan class=\"ingredient\" data-name=\"egg\" data-tooltip=\"0.96\n(Standardized: ~57.6g)\">egg\u003c/span> and the \u003cspan class=\"ingredient\" data-name=\"salt\" data-tooltip=\"0.96 pinch\n(Standardized: ~0.7g)\">salt\u003c/span>. \u003cspan class=\"declaration declaration-block\">\u003ci class=\"ph ph-arrow-elbow-down-right\">\u003c/i> pate$crumbs\u003c/span>\n      \u003c/li>\n      \u003cli value=\"2\">\n        \u003cspan class=\"action\">Fraiser\u003c/span>         Work the \u003cspan class=\"reference\" data-tooltip=\"Intermediate Ingredient\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> pate$crumbs\u003c/span> quickly to gather into a ball without overworking it.\n      \u003c/li>\n      \u003cli value=\"3\">\n        \u003cspan class=\"action\">Rest\u003c/span>         Wrap in \u003cspan class=\"cookware\" data-name=\"cling film\">cling film\u003c/span> and refrigerate for at least \u003cspan class=\"timer passive\" data-tooltip=\"Passive Time (Waiting, resting...)\" data-value=\"2\" data-unit=\"h\">\u003ci class=\"ph ph-hourglass\">\u003c/i> \u003cspan class=\"timer-text\">2 h\u003c/span>\u003c/span>.\n      \u003c/li>\n    \u003c/ol>\n  \u003c/section>\n  \u003csection>\n    \u003ch3 class=\"section-header\">Shell \u003csmall class=\"section-meta-badge section-meta-mass\" data-tooltip=\"Section standardized mass\">\u003ci class=\"ph ph-scales\">\u003c/i> 500g\u003c/small>\u003c/h3>\n    \u003cdiv class=\"section-ingredients\">\n      \u003cul>\n        \u003cli>\u003cspan class=\"reference\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> pate \u003cspan class=\"quantity\">500 \u003cspan class=\"unit\">g\u003c/span>\u003c/span>\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli value=\"1\">\n        \u003cspan class=\"action\">Line\u003c/span>         Roll out the \u003cspan class=\"reference\" data-tooltip=\"Intermediate Ingredient\nQuantity: 500 g\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> pate\u003c/span> and line a \u003cspan class=\"cookware\" data-name=\"tart ring\">tart ring\u003c/span>. Dock with a \u003cspan class=\"cookware\" data-name=\"fork\">fork\u003c/span>.\n      \u003c/li>\n      \u003cli value=\"2\">\n        \u003cspan class=\"action\">Blind bake\u003c/span>         Bake at \u003cspan class=\"temp\" data-value=\"170\" data-unit=\"°C\">\u003ci class=\"ph ph-thermometer\">\u003c/i> 170 °C\u003c/span> for \u003cspan class=\"timer passive\" data-tooltip=\"Passive Time (Waiting, resting...)\" data-value=\"15\" data-unit=\"min\">\u003ci class=\"ph ph-hourglass\">\u003c/i> \u003cspan class=\"timer-text\">15 min\u003c/span>\u003c/span> until lightly golden.\n      \u003c/li>\n    \u003c/ol>\n  \u003c/section>\n  \u003csection>\n    \u003ch3 class=\"section-header\">Curd \u003csmall class=\"section-meta-badge section-meta-mass\" data-tooltip=\"Section standardized mass (Missing: lemon-zest)\">\u003ci class=\"ph ph-scales\">\u003c/i> >1027g\u003c/small> \u003cspan class=\"section-declaration-badge\" data-tooltip=\"Intermediate result for this section\">\u003ci class=\"ph ph-arrow-right\">\u003c/i> curd\u003c/span>\u003c/h3>\n    \u003cdiv class=\"section-ingredients\">\n      \u003cul>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"egg\">egg \u003cspan class=\"quantity\">6\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 360g\">~360g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"sugar\">sugar \u003cspan class=\"quantity\">300 g\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 300g\">300g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"lemon juice\" data-parent=\"lemon\" data-parent-preparation=\"juiced\">lemon juice \u003cspan class=\"composite-parent\">(lemon, juiced)\u003c/span> \u003cspan class=\"quantity\">240 ml\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 247.2g\">~247.2g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"lemon zest\" data-parent=\"lemon\" data-parent-preparation=\"zested\">lemon zest \u003cspan class=\"composite-parent\">(lemon, zested)\u003c/span> \u003cspan class=\"quantity\">4\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"butter\">butter \u003cspan class=\"quantity\">120 g\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 120g\">120g\u003c/span>\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli value=\"1\">\n        \u003cspan class=\"action\">Whisk\u003c/span>         Whisk the \u003cspan class=\"ingredient\" data-name=\"egg\" data-tooltip=\"6\n(Standardized: ~360g)\">egg\u003c/span>, the \u003cspan class=\"ingredient\" data-name=\"sugar\" data-tooltip=\"300 g\n(Standardized: 300g)\">sugar\u003c/span>, the \u003cspan class=\"ingredient\" data-name=\"lemon juice\" data-tooltip=\"240 ml\n(Standardized: ~247.2g)\">lemon juice\u003c/span> and the \u003cspan class=\"ingredient\" data-name=\"lemon zest\" data-tooltip=\"4\">lemon zest\u003c/span> in a \u003cspan class=\"cookware\" data-name=\"saucepan\">saucepan\u003c/span>. \u003cspan class=\"declaration declaration-block\">\u003ci class=\"ph ph-arrow-elbow-down-right\">\u003c/i> curd mix\u003c/span>\n      \u003c/li>\n      \u003cli value=\"2\">\n        \u003cspan class=\"action\">Thicken\u003c/span>         Cook the \u003cspan class=\"reference\" data-tooltip=\"Intermediate Ingredient\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> curd\u003c/span> mix over \u003cspan class=\"temp\" data-semantic=\"low heat\">\u003ci class=\"ph ph-thermometer\">\u003c/i> low heat\u003c/span> for \u003cspan class=\"timer\" data-tooltip=\"Active Time\" data-value=\"5\" data-unit=\"min\">\u003ci class=\"ph ph-timer\">\u003c/i> \u003cspan class=\"timer-text\">5 min\u003c/span>\u003c/span>, stirring, until it coats the \u003cspan class=\"cookware\" data-name=\"spatula\">spatula\u003c/span>. Add the \u003cspan class=\"ingredient\" d >\u003c/span>.\n      \u003c/li>\n    \u003c/ol>\n  \u003c/section>\n  \u003csection>\n    \u003ch3 class=\"section-header\">Shell \u003csmall class=\"section-meta-badge section-meta-mass\" data-tooltip=\"Section standardized mass\">\u003ci class=\"ph ph-scales\">\u003c/i> 750g\u003c/small>\u003c/h3>\n    \u003cdiv class=\"section-ingredients\">\n      \u003cul>\n        \u003cli>\u003cspan class=\"reference\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> pate \u003cspan class=\"quantity\">750 \u003cspan class=\"unit\">g\u003c/span>\u003c/span>\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli value=\"1\">\n        \u003cspan class=\"action\">Line\u003c/span>         Roll out the \u003cspan class=\"reference\" data-tooltip=\"Intermediate Ingredient\nQuantity: 750 g\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> pate\u003c/span> and line a \u003cspan class=\"cookware\" data-name=\"tart ring\">tart ring\u003c/span>. Dock with a \u003cspan class=\"cookware\" data-name=\"fork\">fork\u003c/span>.\n      \u003c/li>\n      \u003cli value=\"2\">\n        \u003cspan class=\"action\">Blind bake\u003c/span>         Bake at \u003cspan class=\"temp\" data-value=\"170\" data-unit=\"°C\">\u003ci class=\"ph ph-thermometer\">\u003c/i> 170 °C\u003c/span> for \u003cspan class=\"timer passive\" data-tooltip=\"Passive Time (Waiting, resting...)\" data-value=\"15\" data-unit=\"min\">\u003ci class=\"ph ph-hourglass\">\u003c/i> \u003cspan class=\"timer-text\">15 min\u003c/span>\u003c/span> until lightly golden.\n      \u003c/li>\n    \u003c/ol>\n  \u003c/section>\n  \u003csection>\n    \u003ch3 class=\"section-header\">Curd \u003csmall class=\"section-meta-badge section-meta-mass\" data-tooltip=\"Section standardized mass (Missing: lemon-zest)\">\u003ci class=\"ph ph-scales\">\u003c/i> >1541g\u003c/small> \u003cspan class=\"section-declaration-badge\" data-tooltip=\"Intermediate result for this section\">\u003ci class=\"p egg\u003c/span> and the \u003cspan class=\"ingredient\" data-name=\"salt\" data-tooltip=\"0.24 pinch\n(Standardized: ~0.2g)\">salt\u003c/span>. \u003cspan class=\"declaration declaration-block\">\u003ci class=\"ph ph-arrow-elbow-down-right\">\u003c/i> pate$crumbs\u003c/span>\n      \u003c/li>\n      \u003cli value=\"2\">\n        \u003cspan class=\"action\">Fraiser\u003c/span>         Work the \u003cspan class=\"reference\" data-tooltip=\"Intermediate Ingredient\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> pate$crumbs\u003c/span> quickly to gather into a ball without overworking it.\n      \u003c/li>\n      \u003cli value=\"3\">\n        \u003cspan class=\"action\">Rest\u003c/span>         Wrap in \u003cspan class=\"cookware\" data-name=\"cling film\">cling film\u003c/span> and refrigerate for at least \u003cspan class=\"timer passive\" data-tooltip=\"Passive Time (Waiting, resting...)\" data-value=\"2\" data-unit=\"h\">\u003ci class=\"ph ph-hourglass\">\u003c/i> \u003cspan class=\"timer-text\">2 h\u003c/span>\u003c/span>.\n      \u003c/li>\n    \u003c/ol>\n  \u003c/section>\n  \u003csection>\n    \u003ch3 class=\"section-header\">Shell \u003csmall class=\"section-meta-badge section-meta-mass\" data-tooltip=\"Section standardized mass\">\u003ci class=\"ph ph-scales\">\u003c/i> 125g\u003c/small>\u003c/h3>\n    \u003cdiv class=\"section-ingredients\">\n      \u003cul>\n        \u003cli>\u003cspan class=\"reference\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> pate \u003cspan class=\"quantity\">125 \u003cspan class=\"unit\">g\u003c/span>\u003c/span>\u003c/span>\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli value=\"1\">\n        \u003cspan class=\"action\">Line\u003c/span>         Roll out the \u003cspan class=\"reference\" data-tooltip=\"Intermediate Ingredient\nQuantity: 125 g\">\u003ci class=\"ph ph-caret-circle-right\">\u003c/i> pate\u003c/span> and line a \u003cspan class=\"cookware\" data-name=\"tart ring\">tart ring\u003c/span>. Dock with a \u003cspan class=\"cookware\" data-name=\"fork\">fork\u003c/span>.\n      \u003c/li>\n      \u003cli value=\"2\">\n        \u003cspan class=\"action\">Blind bake\u003c/span>         Bake at \u003cspan class=\"temp\" data-value=\"170\" data-unit=\"°C\">\u003ci class=\"ph ph-thermometer\">\u003c/i> 170 °C\u003c/span> for \u003cspan class=\"timer passive\" data-tooltip=\"Passive Time (Waiting, resting...)\" data-value=\"15\" data-unit=\"min\">\u003ci class=\"ph ph-hourglass\">\u003c/i> \u003cspan class=\"timer-text\">15 min\u003c/span>\u003c/span> until lightly golden.\n      \u003c/li>\n    \u003c/ol>\n  \u003c/section>\n  \u003csection>\n    \u003ch3 class=\"section-header\">Curd \u003csmall class=\"section-meta-badge section-meta-mass\" data-tooltip=\"Section standardized mass (Missing: lemon-zest)\">\u003ci class=\"ph ph-scales\">\u003c/i> >257g\u003c/small> \u003cspan class=\"section-declaration-badge\" data-tooltip=\"Intermediate result for this section\">\u003ci class=\"ph ph-arrow-right\">\u003c/i> curd\u003c/span>\u003c/h3>\n    \u003cdiv class=\"section-ingredients\">\n      \u003cul>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"egg\">egg \u003cspan class=\"quantity\">1.5\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 90g\">~90g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"sugar\">sugar \u003cspan class=\"quantity\">75 g\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 75g\">75g\u003c/span>\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"ingredient\" data-name=\"lemon juice\" data-parent=\"lemon\" data-parent-preparation=\"juiced\">lemon juice \u003cspan class=\"composite-parent\">(lemon, juiced)\u003c/span> \u003cspan class=\"quantity\">60 ml\u003c/span> \u003cspan class=\"mass-badge\" data-tooltip=\"Standardized mass: 61.8g\">~61.8g\u003c/span>\u003c/span>\u003c/li>\n        \u0
