project:
  type: website
  output-dir: _site
  resources:
    - recipe-app.js
    - recipes-index.json
    - recipes-index-fr.json

website:
  title: "Cookbook"
  site-url: https://antoinelucasfra.github.io/cookbook-web/
  navbar:
    left:
      - href: index.qmd
        text: Cookbook
      - href: browse.qmd
        text: Browse
      - href: import.qmd
        text: Import
      - text: "🌐"
        menu:
          - text: "English"
            href: index.qmd
          - text: "Français"
            href: fr/index.qmd
  page-footer: "Cooked with [Gram](https://gram-lang.org) + Quarto"

format:
  html:
    theme: cosmo
    lang: en
    filters:
      - gram
    css:
      - css/gram.css
      - css/gantt.css
      - css/app.css
    include-in-header: _partials/head.html
