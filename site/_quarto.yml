project:
  type: website
  output-dir: _site
  resources:
    - recipe-app.js
    - recipes-index.json
    - recipes-index-fr.json

website:
  title: "Cookbook"
  site-url: https://antoinelucasfra.github.io/cookbook/
  navbar:
    left:
      - href: index.qmd
        text: Recipes
      - href: browse.qmd
        text: Browse
      - href: import.qmd
        text: Import
      - href: fr/index.qmd
        text: Français 🇫🇷
  page-footer: "Cooked with [Gram](https://gram-lang.org) + Quarto"

format:
  html:
    theme: cosmo
    lang: en
    filters:
      - gram
    css:
      - css/gram.css
      - css/gantt.css
      - css/app.css
    include-in-header: _partials/head.html
